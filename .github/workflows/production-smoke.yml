name: Check public production feed
on:
  push:
    branches: [main]
    paths: [.github/workflows/production-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public URL, current adapter and a subsequent refresh
        shell: python
        run: |
          import urllib.request, urllib.error, json, time, datetime
          url = 'https://tablicafigitaldeploy.vercel.app/api/bracket'
          def read():
              req = urllib.request.Request(url, headers={'Accept':'application/json','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = json.loads(response.read(1000000))
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
                  try: data = json.loads(error.read(5000))
                  except Exception: data = {'error':{'code':'NOT_JSON'}}
              report = {k:data.get(k) for k in ['adapterVersion','ok','stale','demo','requiresCredentials','mappingVerified','fetchedAt','source','version']}
              report.update(http=status, matches=len(data.get('matches',[])), error=data.get('error',{}).get('code'), checkedAt=datetime.datetime.now(datetime.timezone.utc).isoformat())
              print('PRODUCTION_CHECK',json.dumps(report,ensure_ascii=False),flush=True)
              return status,data
          good = None
          for attempt in range(6):
              status,data = read()
              if status == 200 and data.get('adapterVersion') == 'public-1.1.0' and data.get('ok') is True and data.get('stale') is False:
                  assert data.get('requiresCredentials') is False and data.get('demo') is False
                  assert data.get('mappingVerified') is True and len(data['matches']) == 38
                  good = data
                  break
              if status in (401,403): raise SystemExit('Public URL requires access; no authorization bypass attempted.')
              time.sleep(15)
          assert good is not None, 'Production is not on the verified public adapter or source is unavailable.'
          for number in [1,12,17,21,38]:
              match=next(m for m in good['matches'] if m['number']==number)
              print('PRODUCTION_MATCH',json.dumps({'match':number,'teams':[t['name'] or t['placeholder'] for t in match['teams']],'scores':match['scores']},ensure_ascii=False),flush=True)
          first = datetime.datetime.fromisoformat(good['fetchedAt'].replace('Z','+00:00'))
          assert abs((datetime.datetime.now(datetime.timezone.utc)-first).total_seconds()) < 120
          time.sleep(40)
          status,second = read()
          assert status == 200 and second.get('ok') and not second.get('stale')
          assert second.get('adapterVersion') == 'public-1.1.0'
          later=datetime.datetime.fromisoformat(second['fetchedAt'].replace('Z','+00:00'))
          assert later > first, 'Source refresh timestamp did not advance.'
          print('PRODUCTION_VERIFIED_WITH_TWO_SOURCE_READS',flush=True)
